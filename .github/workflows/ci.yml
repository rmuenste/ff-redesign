# Runs the same checks that gate the Pages deploy, on every pull request, so a
# red build shows up on the PR instead of on master after the merge.
#
# Kept apart from pages.yml on purpose: pull requests get read-only
# permissions, never touch Pages, and do not queue behind a deploy in the
# `pages` concurrency group.
name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

# A new push to the same PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # Regenerates the reference index, type-checks and bundles; catches what
      # the unit suite does not.
      - name: Build
        run: npm run build

  # Same as the mobile-layout job in pages.yml: every route and every
  # benchmark tab at 390px and 768px.
  mobile-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Check mobile layout
        run: npm run test:e2e
